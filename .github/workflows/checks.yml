# Every push and pull request runs the same checks as `npm run upload`, without the upload: build, build guards,
# lint (with jsx-a11y), formatting, types and tests. A push to main that passes them uploads the project with HubSpot's
# own project action, which builds it and deploys the build. The key is the repository secret HUBSPOT_PERSONAL_ACCESS_KEY
# and the account id the variable HUBSPOT_ACCOUNT_ID; pull requests never reach the deploy job, so a fork never sees
# the key.
name: checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            src/theme/litora-react/package-lock.json
      - run: npm ci
      - run: npm ci --prefix src/theme/litora-react
      - name: Guards self-test
        run: for g in lang tokens hardcoded; do node scripts/guards/check-$g.cjs --self-test; done
      - run: npm run verify
      - name: Generated files are committed
        run: npm run check:generated

  deploy:
    needs: checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # one upload at a time; a newer push waits for the running one instead of racing it
    concurrency:
      group: hubspot-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - name: Upload and deploy the project
        uses: HubSpot/hubspot-project-actions@v1.1.2
        with:
          account_id: ${{ vars.HUBSPOT_ACCOUNT_ID }}
          personal_access_key: ${{ secrets.HUBSPOT_PERSONAL_ACCESS_KEY }}
          # the CLI version of package.json, so CI builds with the same CLI as a local upload
          cli_version: 8.16.0
